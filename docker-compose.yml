version: "3.9"
 
services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: curriculum_engine_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: curriculum_engine
      POSTGRES_USER: appuser
      POSTGRES_PASSWORD: apppass
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U appuser -d curriculum_engine"]
      interval: 10s
      timeout: 5s
      retries: 5
 
volumes:
  postgres_data: